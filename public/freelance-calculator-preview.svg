<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  
  <!-- Background elements -->
  <rect x="0" y="0" width="1200" height="15" fill="#1e293b"/>
  <rect x="0" y="615" width="1200" height="15" fill="#1e293b"/>
  
  <!-- Title -->
  <text x="600" y="120" font-family="serif" font-size="60" font-weight="700" text-anchor="middle" fill="#1e293b">
    Freelance Rate Calculator
  </text>
  
  <!-- Divider -->
  <line x1="400" y1="160" x2="800" y2="160" stroke="#475569" stroke-width="4"/>
  
  <!-- Calculator icon -->
  <rect x="450" y="200" width="300" height="350" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-width="4"/>
  
  <!-- Display screen -->
  <rect x="470" y="220" width="260" height="80" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  
  <!-- Dollar sign -->
  <text x="500" y="275" font-family="sans-serif" font-size="45" font-weight="700" fill="#1e293b">$</text>
  
  <!-- Display amount -->
  <text x="700" y="275" font-family="sans-serif" font-size="40" font-weight="700" text-anchor="end" fill="#1e293b">95/hr</text>
  
  <!-- Calculator buttons -->
  <rect x="470" y="320" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="540" y="320" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="610" y="320" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="670" y="320" width="60" height="60" rx="5" fill="#f87171" stroke="#64748b" stroke-width="2"/>
  
  <rect x="470" y="390" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="540" y="390" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="610" y="390" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="670" y="390" width="60" height="60" rx="5" fill="#f87171" stroke="#64748b" stroke-width="2"/>
  
  <rect x="470" y="460" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="540" y="460" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="610" y="460" width="60" height="60" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="670" y="460" width="60" height="60" rx="5" fill="#f87171" stroke="#64748b" stroke-width="2"/>
  
  <!-- Tagline -->
  <text x="600" y="560" font-family="sans-serif" font-size="28" text-anchor="middle" fill="#475569">
    Calculate hourly, daily and weekly rates based on your salary
  </text>
  
  <!-- Footer tag -->
  <text x="600" y="600" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#64748b">
    Created by Claude at anthropic.com
  </text>
</svg>